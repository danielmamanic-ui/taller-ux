<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de notas del grupo</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <main class="contenedor">
    <h1>Registro de notas</h1>
    <p class="ayuda">Notas de 0 a 20. Se aprueba con 11 o más.</p>

    <!-- Bloque 1: agregar (Miller: el formulario solo pide dos datos) -->
    <section class="tarjeta" aria-labelledby="titulo-agregar">
      <h2 id="titulo-agregar">1. Agregar estudiante</h2>
      <form id="formEstudiante" novalidate>
        <div class="campos">
          <div class="campo campo-nombre">
            <label for="nombre">Nombre del estudiante</label>
            <input id="nombre" type="text" autocomplete="off" required>
          </div>
          <div class="campo campo-nota">
            <label for="nota">Nota</label>
            <input id="nota" type="number" min="0" max="20" step="0.5" inputmode="decimal" required aria-describedby="ayuda-nota">
          </div>
        </div>
        <p id="ayuda-nota" class="pista">Escribe el nombre y una nota entre 0 y 20 para activar el botón.</p>
        <button type="submit" id="btnAgregar" class="boton-principal" disabled>Agregar estudiante</button>
      </form>
    </section>

    <!-- Mensaje visible despues de cada accion (visibilidad del estado) -->
    <div id="aviso" class="aviso" role="status" aria-live="polite">
      <span id="avisoTexto"></span>
      <button type="button" id="btnDeshacer" class="boton-texto" hidden>Deshacer</button>
    </div>

    <!-- Bloque 2: lista -->
    <section class="tarjeta" aria-labelledby="titulo-lista">
      <h2 id="titulo-lista">2. Estudiantes</h2>
      <label for="buscar">Buscar por nombre</label>
      <input id="buscar" type="search" autocomplete="off">

      <fieldset class="filtro">
        <legend>Mostrar</legend>
        <label class="opcion"><input type="radio" name="filtro" value="todos" checked> Todos</label>
        <label class="opcion"><input type="radio" name="filtro" value="aprobado"> Aprobados</label>
        <label class="opcion"><input type="radio" name="filtro" value="desaprobado"> Desaprobados</label>
      </fieldset>

      <p id="conteo" class="pista"></p>
      <ul id="lista" class="lista"></ul>
    </section>

    <!-- Bloque 3: resumen en tres datos -->
    <section class="tarjeta" aria-labelledby="titulo-resumen">
      <h2 id="titulo-resumen">3. Resumen del grupo</h2>
      <div class="resumen">
        <p class="dato"><span class="dato-valor" id="promedio">0.00</span><span class="dato-nombre">Promedio</span></p>
        <p class="dato"><span class="dato-valor" id="aprobados">0</span><span class="dato-nombre">Aprobados</span></p>
        <p class="dato"><span class="dato-valor" id="desaprobados">0</span><span class="dato-nombre">Desaprobados</span></p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
